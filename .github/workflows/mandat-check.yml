name: Mandat tekshiruvi

on:
  schedule:
    # Har 15 daqiqada (GitHub bir necha daqiqa kechikishi mumkin)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mandat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r mandat-bot/requirements.txt

      - name: Saytni tekshirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UZBMB_PHPSESSID: ${{ secrets.UZBMB_PHPSESSID }}
          SEND_HEARTBEAT: "1"
          HEARTBEAT_HOUR: "8"
        run: python mandat-bot/check.py

      - name: Holatni saqlash
        run: |
          if [ -n "$(git status --porcelain mandat-bot/state.json)" ]; then
            git config user.name "mandat-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mandat-bot/state.json
            git commit -m "chore(bot): holat yangilandi [skip ci]"
            git push
          else
            echo "O'zgarish yo'q, commit qilinmadi."
          fi
