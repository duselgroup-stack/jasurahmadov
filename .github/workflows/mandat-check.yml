name: Mandat tekshiruvi

on:
  schedule:
    # Har 15 daqiqada (GitHub bir necha daqiqa kechikishi mumkin)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mandat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r mandat-bot/requirements.txt

      - name: Saytni tekshirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UZBMB_PHPSESSID: ${{ secrets.UZBMB_PHPSESSID }}
          # "1" - har tekshiruvda "chiqdi/chiqmadi" hisoboti keladi.
          # "0" - faqat mandat chiqqanda + kuniga bir marta holat.
          REPORT_EVERY_RUN: "1"
          SEND_HEARTBEAT: "1"
          HEARTBEAT_HOUR: "8"
        run: python mandat-bot/check.py

      # Holat saqlanmasa ham tekshiruvning o'zi bajarilgan bo'ladi,
      # shuning uchun bu qadam butun ishni yiqitmasligi kerak.
      - name: Holatni saqlash
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain mandat-bot/state.json)" ]; then
            echo "O'zgarish yo'q, commit qilinmadi."
            exit 0
          fi

          git config user.name "mandat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandat-bot/state.json
          git commit -m "chore(bot): holat yangilandi [skip ci]"

          # Boshqa ishga tushish oralig'ida shox oldinga ketgan bo'lishi mumkin.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Holat saqlandi."
              exit 0
            fi
            echo "$i-urinish muvaffaqiyatsiz, qayta urinamiz."
            sleep 5
          done

          echo "Holatni saqlab bo'lmadi - keyingi tekshiruvda qayta urinadi."
